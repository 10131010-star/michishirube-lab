name: B2B offer prototype checks
on:
  pull_request:
    paths:
      - "service-offer/**"
      - "tests/test_b2b_offer.py"
      - ".github/workflows/b2b-offer-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check offer claims and no unapproved external actions
        run: python3 -m unittest discover -s tests -p "test_b2b_offer.py" -v
