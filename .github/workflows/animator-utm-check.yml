name: Animator CTA UTM checks
on:
  pull_request:
    paths:
      - 'vrchat-animator-check/index.html'
      - 'tests/animator-utm-links.cjs'
      - '.github/workflows/animator-utm-check.yml'
  push:
    branches: [main]
    paths:
      - 'vrchat-animator-check/index.html'
      - 'tests/animator-utm-links.cjs'
      - '.github/workflows/animator-utm-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tracking URLs and existing click events
        run: node tests/animator-utm-links.cjs
