name: Animator purchase funnel regression
on:
  pull_request:
    paths:
      - "vrchat-animator-check/index.html"
      - "tests/test_animator_funnel.py"
      - ".github/workflows/animator-funnel-check.yml"
  push:
    branches: [main]
    paths:
      - "vrchat-animator-check/index.html"
      - "tests/test_animator_funnel.py"
      - ".github/workflows/animator-funnel-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate UTM links, click events, and honest conversion reporting
        run: python3 -m unittest discover -s tests -p "test_animator_funnel.py" -v
